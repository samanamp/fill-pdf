name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Stage site files
        run: |
          mkdir -p dist
          cp -r index.html app.js redact.js styles.css favicon.svg _headers lib fonts dist/

      - name: Check Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api() { curl -s -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4$1"; }
          echo "token length: ${#CLOUDFLARE_API_TOKEN}"
          echo "verify:  $(api /user/tokens/verify | python3 -c 'import sys,json;r=json.load(sys.stdin);print(r.get("success"),(r.get("result") or {}).get("status"),[e.get("message") for e in r.get("errors",[])])')"
          echo "pages:   $(api /accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/fill-pdf | python3 -c 'import sys,json;r=json.load(sys.stdin);print(r.get("success"),[e.get("message") for e in r.get("errors",[])])')"

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy dist \
            --project-name fill-pdf \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "${GITHUB_REF_NAME}: ${GITHUB_SHA::7}"
